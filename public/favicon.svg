<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Square Background in Primary Deep Blue -->
  <rect width="512" height="512" rx="128" fill="#0f3ba2"/>
  
  <!-- Stylized Letter E in Crisp White -->
  <g fill="#ffffff">
    <!-- Vertical Stem -->
    <rect x="150" y="120" width="50" height="272" rx="12"/>
    <!-- Top Arm -->
    <rect x="150" y="120" width="190" height="50" rx="12"/>
    <!-- Middle Arm -->
    <rect x="150" y="231" width="150" height="50" rx="12"/>
    <!-- Bottom Arm -->
    <rect x="150" y="342" width="190" height="50" rx="12"/>
  </g>
  
  <!-- Rust Orange Accent Dot in top-right -->
  <circle cx="390" cy="125" r="32" fill="#ea580c"/>
</svg>